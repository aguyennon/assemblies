<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dalmen Assembly Screen</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    /* Big, high-contrast, glanceable-from-across-the-shop styling. */
    :root {
      --bg: #0f1115; --panel: #1a1d24; --text: #f2f4f8;
      --muted: #8a93a3; --ok: #1faa59; --bad: #d23b3b; --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      /* hide the text cursor — there's no human typing here */
      cursor: none;
    }
 
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 28px; background: var(--panel);
      border-bottom: 2px solid #000;
    }
    .batch { font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; }
    .batch small { display:block; font-size: 0.9rem; color: var(--muted); font-weight: 400; }
    #clock { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #date  { font-size: 1rem; color: var(--muted); text-align: right; }
 
    /* Status banner flips green/red based on the scan result. */
    #status {
      padding: 10px 28px; font-size: 1.3rem; font-weight: 600;
      background: var(--accent);
    }
    #status.ok  { background: var(--ok); }
    #status.bad { background: var(--bad); }
 
    main { flex: 1; overflow-y: auto; padding: 0 28px 28px; }
 
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td {
      text-align: left; padding: 18px 16px; font-size: 1.7rem;
      border-bottom: 1px solid #2a2e37;
    }
    th { color: var(--muted); font-size: 1.1rem; text-transform: uppercase;
         letter-spacing: 1px; position: sticky; top: 0; background: var(--bg); }
    tr:nth-child(even) td { background: #14171d; }
    td.dim, td.qty { font-weight: 700; font-variant-numeric: tabular-nums; }
 
    .empty { text-align: center; color: var(--muted); font-size: 1.6rem; padding: 60px; }
 
    /* The scan capture input: present and focused, but invisible. The scanner's
       keystrokes land here. opacity:0 + tiny size keeps it off-screen but focusable. */
    #scanInput { position: fixed; top: -100px; left: -100px; opacity: 0; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <img src="/dalmen_logo.png" style="height:108px;" />
      <div class="batch" id="batch">— <small id="scanned">Awaiting Scan…</small></div>
    </div>
    <div class="batch" id="scanDisplay" style="position:absolute; left:50%; transform:translateX(-50%); text-align:center;">—</div>
    <div>
      <div id="clock">--:--:--</div>
      <div id="date"></div>
    </div>
  </header>
 
  <div id="status">Ready — Scan a Barcode</div>
 
  <main>
    <table>
      <thead>
        <tr>
          <th>Description</th>
          <th>Extrusion</th>
          <th>Dim (mm)</th>
          <th>Qty</th>
          <th>Sens</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">Scan a barcode to begin</td></tr>
      </tbody>
    </table>
  </main>
 
  <!-- Hidden, always-focused input that captures the scanner's "keyboard" output. -->
  <input id="scanInput" autocomplete="off" />
 
  <script>
    // ---------- Live clock ----------
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
      document.getElementById('date').textContent  = now.toLocaleDateString(undefined,
        { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(tick, 1000);  // redraw every second
    tick();                    // and once immediately so it's not blank
 
    // ---------- Keep the hidden input focused at all times ----------
    // The operator has no keyboard/mouse. We must guarantee the scanner's
    // keystrokes always have somewhere to land, so we re-grab focus aggressively.
    const scanInput = document.getElementById('scanInput');
    function refocus() { scanInput.focus(); }
    refocus();
    setInterval(refocus, 500);        // re-assert focus twice a second
    document.addEventListener('click', refocus);
    window.addEventListener('focus', refocus);
 
    // ---------- SignalR connection ----------
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/scanHub")
      .withAutomaticReconnect()   // if the LAN blips, reconnect on its own
      .build();
 
    // Server pushes results here. This is the auto-update: no reload, no click.
    connection.on("ReceiveResult", render);
 
    async function start() {
      try { await connection.start(); setStatus("Ready — scan a barcode", ""); }
      catch { setStatus("Reconnecting…", "bad"); setTimeout(start, 2000); }
    }
    start();
 
    // ---------- Capture a scan ----------
    let scanBuffer = '';
    let scanTimer = null;

    scanInput.addEventListener('input', () => {
      clearTimeout(scanTimer);
      scanBuffer = scanInput.value;
      
      // Wait 100ms after last character — if no more input, treat as complete scan
      scanTimer = setTimeout(() => {
        const code = scanBuffer.trim();
        scanBuffer = '';
        scanInput.value = '';
        if (code.length > 0) {
          connection.invoke("SubmitScan", code)
            .catch(() => setStatus("Connection lost — scan again", "bad"));
        }
      }, 100);
    });

    scanInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(scanTimer);
        const code = scanInput.value.trim();
        scanInput.value = '';
        scanBuffer = '';
        if (code.length > 0) {
          connection.invoke("SubmitScan", code)
            .catch(() => setStatus("Connection lost — scan again", "bad"));
        }
      }
    });
    // ---------- Render a result ----------
    function render(result) {
      const scanParts = (result.scannedCode || '').split('-');
      const orderNo = scanParts.length >= 2 ? scanParts[0] + '-' + scanParts[1] : '';
      const posNum = scanParts.length >= 3 ? scanParts[2] : result.scannedCode;
      document.getElementById('scanned').textContent = result.scannedCode || '—';
      document.getElementById('scanDisplay').textContent = (orderNo + '-' + posNum);
 
      if (result.success) {
        document.getElementById('batch').childNodes[0].nodeValue = ("Lot: " + result.batchNo || '—') + ' ';
        setStatus("Loaded Successfully — " + result.rows.length + " cut(s) for Screen", "ok");
        drawRows(result.rows);
      } else {
        document.getElementById('batch').childNodes[0].nodeValue = '— ';
        document.getElementById('scanDisplay').textContent = '-';
        setStatus(result.message || "Not found — scan again", "bad");
        drawRows([]);   // clear the table on failure
      }
    }
 
    function drawRows(rows) {
      const tbody = document.getElementById('rows');
      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No cuts to display</td></tr>';
        return;
      }
      // Build rows safely via textContent (never innerHTML with data) so a stray
      // character in the DB can't break the layout or inject markup.
      tbody.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        tr.appendChild(cell(r.description));
        tr.appendChild(cell(r.extrusion));
        tr.appendChild(cell(r.dimMM, 'dim'));
        tr.appendChild(cell(r.qtsPiece, 'qty'));
        const sens = r.sens === 'L' ? 'L ↔' : r.sens === 'H' ? 'H ↕' : r.sens;
        tr.appendChild(cell(sens));
        tbody.appendChild(tr);
      }
    }
 
    function cell(text, cls) {
      const td = document.createElement('td');
      td.textContent = text ?? '';
      if (cls) td.className = cls;
      return td;
    }
 
    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = cls;   // '', 'ok', or 'bad'
    }
  </script>
</body>
</html>
