<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assembly Moulure A Brique</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #1a1d24; --text: #f2f4f8;
      --muted: #8a93a3; --ok: #1faa59; --bad: #d23b3b; --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      cursor: none;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 28px; background: var(--panel);
      border-bottom: 2px solid #000;
    }
    .batch { font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; }
    .batch small { display:block; font-size: 0.9rem; color: var(--muted); font-weight: 400; }
    #clock { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #date  { font-size: 1rem; color: var(--muted); text-align: right; }

    #status {
      padding: 10px 28px; font-size: 1.3rem; font-weight: 600;
      background: var(--accent);
    }
    #status.ok  { background: var(--ok); }
    #status.bad { background: var(--bad); }

    main { flex: 1; overflow-y: auto; padding: 0 28px 28px; }

    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td {
      text-align: left; padding: 18px 16px; font-size: 1.7rem;
      border-bottom: 1px solid #2a2e37;
    }
    th { color: var(--muted); font-size: 1.1rem; text-transform: uppercase;
         letter-spacing: 1px; position: sticky; top: 0; background: var(--bg); }
    tr:nth-child(even) td { background: #14171d; }
    td.dim { font-weight: 700; font-variant-numeric: tabular-nums; }

    .empty { text-align: center; color: var(--muted); font-size: 1.6rem; padding: 60px; }

    #scanInput { position: fixed; top: -100px; left: -100px; opacity: 0; }

    #gridWrap {
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
    }
    .grid-row { display: flex; gap: 3px; }
    .grid-cell {
      width: 36px; height: 36px;
      border: 2px solid #3a3f4b;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
      color: var(--muted);
      background: #1a1d24;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .grid-cell.in-assembly {
      background: #145c30;
      border-color: var(--ok);
      color: #fff;
    }
    .grid-cell.scanned {
      background: var(--ok);
      border-color: #5fffaa;
      color: #000;
      box-shadow: 0 0 12px #1faa59aa;
    }

    #header-right { display: flex; align-items: center; gap: 24px; }
    #clockWrap { text-align: right; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <img src="/dalmen_logo.png" style="height:108px;" />
      <div class="batch" id="batch">— <small id="scanned">Awaiting Scan…</small></div>
    </div>
    <div class="batch" id="scanDisplay"
         style="position:absolute; left:50%; transform:translateX(-50%); text-align:center;">—</div>
    <div id="header-right">
      <div id="gridWrap"></div>
      <div id="clockWrap">
        <div id="clock">--:--:--</div>
        <div id="date"></div>
      </div>
    </div>
  </header>

  <div id="status">Ready — Scan a Barcode</div>

  <main>
    <table>
      <thead>
        <tr>
          <th>POSITION NO.</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="2" class="empty">Scan a barcode to begin</td></tr>
      </tbody>
    </table>
  </main>

  <input id="scanInput" autocomplete="off" />

  <script>
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
      document.getElementById('date').textContent  = now.toLocaleDateString(undefined,
        { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(tick, 1000);
    tick();

    const scanInput = document.getElementById('scanInput');
    function refocus() { scanInput.focus(); }
    refocus();
    setInterval(refocus, 500);
    document.addEventListener('click', refocus);
    window.addEventListener('focus', refocus);

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/scanHub")
      .withAutomaticReconnect()
      .build();
    connection.on("ReceiveResult", render);
    async function start() {
      try { await connection.start(); setStatus("Ready — scan a barcode", ""); }
      catch { setStatus("Reconnecting…", "bad"); setTimeout(start, 2000); }
    }
    start();

    let scanBuffer = '';
    let scanTimer  = null;
    scanInput.addEventListener('input', () => {
      clearTimeout(scanTimer);
      scanBuffer = scanInput.value;
      scanTimer = setTimeout(() => {
        const code = scanBuffer.trim();
        scanBuffer = ''; scanInput.value = '';
        if (code.length > 0)
          connection.invoke("SubmitScan", code)
            .catch(() => setStatus("Connection lost — scan again", "bad"));
      }, 100);
    });
    scanInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      clearTimeout(scanTimer);
      const code = scanInput.value.trim();
      scanInput.value = ''; scanBuffer = '';
      if (code.length > 0)
        connection.invoke("SubmitScan", code)
          .catch(() => setStatus("Connection lost — scan again", "bad"));
    });

    function render(result) {
      const scanParts = (result.scannedCode || '').split('-');
      const orderNo = scanParts.length >= 2 ? scanParts[0] + '-' + scanParts[1] : '';
      const posNum  = scanParts.length >= 3  ? scanParts[2] : result.scannedCode;
      document.getElementById('scanned').textContent = result.scannedCode || '—';
      document.getElementById('scanDisplay').textContent = orderNo + '-' + posNum;

      if (result.success) {
        document.getElementById('batch').childNodes[0].nodeValue = ('Lot: ' + result.batchNo) + ' ';
        document.getElementById('scanDisplay').textContent = 'ASSEMBLY NO. ' + (result.assemblyNo ?? '—');
        setStatus("Loaded Successfully — " + result.rows.length + " cut(s) for Moulure A Brique", "ok");
        drawRows(result.rows, result.totalWidth, result.totalHeight);
        drawGrid(result.rows, result.scannedCode);
      } else {
        document.getElementById('batch').childNodes[0].nodeValue = '— ';
        document.getElementById('scanDisplay').textContent = '—';
        setStatus(result.message || "Not found — scan again", "bad");
        drawRows([], 0, 0);
        drawGrid([], null);
      }
    }

    function drawGrid(rows, scannedCode) {
      const wrap = document.getElementById('gridWrap');
      wrap.innerHTML = '';
      const positions = rows.map(r => parseInt(r.qtsPiece)).filter(n => !isNaN(n));
      const posSet = new Set(positions);
      const scannedRow = rows.find(r => r.extrusion === scannedCode);
      const scannedPos = scannedRow ? parseInt(scannedRow.qtsPiece) : -1;
      const COLS = 5;
      const totalRows = Math.ceil(25 / COLS);
      for (let row = 0; row < totalRows; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'grid-row';
        for (let col = 0; col < COLS; col++) {
          const num = row * COLS + col + 1;
          const c = document.createElement('div');
          c.className = 'grid-cell';
          c.textContent = num;
          if (num === scannedPos)   c.classList.add('scanned');
          else if (posSet.has(num)) c.classList.add('in-assembly');
          rowEl.appendChild(c);
        }
        wrap.appendChild(rowEl);
      }
    }

    function drawRows(rows, totalWidth, totalHeight) {
      const tbody = document.getElementById('rows');
      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" class="empty">No assembly to display</td></tr>';
        return;
      }
      tbody.innerHTML = '';

      const seen = new Set();
      for (const r of rows) {
        if (seen.has(r.qtsPiece)) continue;
        seen.add(r.qtsPiece);
        const tr = document.createElement('tr');
        const posTd = document.createElement('td');
        const codeSmall = document.createElement('div');
        codeSmall.textContent = r.extrusion ?? '';
        codeSmall.style.cssText = 'font-size:0.75rem; color:var(--muted); margin-bottom:4px;';
        const posLabel = document.createElement('div');
        posLabel.textContent = r.qtsPiece ? 'POSITION NO. ' + r.qtsPiece : '';
        posTd.appendChild(codeSmall);
        posTd.appendChild(posLabel);
        tr.appendChild(posTd);
        tr.appendChild(cell(r.description));
        tbody.appendChild(tr);
      }

      const tfoot = document.createElement('tr');
      tfoot.style.cssText = 'border-top: 2px solid #3a3f4b;';
      const labelTd = document.createElement('td');
      labelTd.style.cssText = 'font-size:1.1rem; color:var(--muted);';
      labelTd.textContent = 'DIMENSION TOTALS';
      const totalsTd = document.createElement('td');
      totalsTd.style.cssText = 'font-size:1.4rem; font-weight:700;';
      totalsTd.textContent = `L ↔  ${totalWidth % 1 === 0 ? totalWidth : totalWidth.toFixed(1)} mm      H ↕  
        ${totalHeight % 1 === 0 ? totalHeight : totalHeight.toFixed(1)} mm`;
      tfoot.appendChild(labelTd);
      tfoot.appendChild(totalsTd);
      tbody.appendChild(tfoot);
    }

    function cell(text, cls) {
      const td = document.createElement('td');
      td.textContent = text ?? '';
      if (cls) td.className = cls;
      return td;
    }

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = cls;
    }
  </script>
</body>
</html>
